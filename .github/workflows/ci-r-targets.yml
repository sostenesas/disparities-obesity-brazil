name: CI (R targets)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          R -e 'install.packages(c("targets","dplyr","tibble"))'

      - name: Run targets smoke snapshot
        run: |
          R -e 'targets::tar_make(names = "smoke_snapshot")'
